<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f6f7">
  <meta name="description" content="Con mucha alegría quiero invitarte a compartir una noche inolvidable. Mis XV — Ailyn.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bloomdate-ailyn15.netlify.app/">
  <meta property="og:title" content="Mis XV — Ailyn">
  <meta property="og:description" content="Con mucha alegría quiero invitarte a compartir una noche inolvidable. Tocá el enlace y descubrí todos los detalles.">
  <meta property="og:image" content="https://bloomdate-ailyn15.netlify.app/assets/whatsapp-ailyn.jpg">
  <meta property="og:image:secure_url" content="https://bloomdate-ailyn15.netlify.app/assets/whatsapp-ailyn.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Invitación a los XV de Ailyn — 21 de noviembre de 2026">
  <meta name="twitter:card" content="summary_large_image">
  <title>Mis XV — Ailyn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pinyon+Script&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="welcome" id="welcome" role="dialog" aria-label="Elegí cómo entrar a la invitación">
    <img src="assets/entrada-ailyn.png" alt="Mis XV Ailyn. Elegí cómo querés entrar">
    <button class="welcome-choice welcome-music" type="button" aria-label="Entrar con música"></button>
    <button class="welcome-choice welcome-silent" type="button" aria-label="Entrar sin música"></button>
    <div class="glam-name welcome-name" aria-hidden="true"><span class="glam-text">Ailyn</span><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <main>
    <section class="panel image-panel hero" aria-label="Portada de los XV de Ailyn">
      <img src="assets/portada-ailyn.png" alt="Mis XV Ailyn">
      <div class="glam-name hero-name" aria-hidden="true"><span class="glam-text">Ailyn</span><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <span class="scroll-cue" aria-hidden="true">⌄</span>
    </section>

    <section class="panel countdown" aria-labelledby="countdown-title">
      <img src="assets/cuenta-regresiva.png" alt="" aria-hidden="true">
      <div class="countdown-content">
        <p id="countdown-title">FALTA MUY POCO</p>
        <div class="timer" aria-live="polite">
          <div><strong id="days">00</strong><span>DÍAS</span></div>
          <div><strong id="hours">00</strong><span>HORAS</span></div>
          <div><strong id="minutes">00</strong><span>MINUTOS</span></div>
          <div><strong id="seconds">00</strong><span>SEGUNDOS</span></div>
        </div>
        <p>PARA VIVIR UNA NOCHE INOLVIDABLE</p>
      </div>
    </section>

    <section class="panel date-reveal" aria-label="Fecha y hora">
      <img class="date-result" src="assets/fecha-revelada.png" alt="Sábado 21 de noviembre, de 21:30 a 05:30 horas">
      <img id="scratch-source" src="assets/cuenta-regresiva.png" alt="" hidden>
      <canvas class="date-cover" aria-label="Pasá el dedo sobre toda la pantalla para descubrir la fecha"></canvas>
      <div class="scratch-sparkles" aria-hidden="true"></div>
      <div class="scratch-instruction" aria-hidden="true">
        <div class="instruction-copy">
          <span>AGENDÁ ESTA FECHA</span>
          <strong>PASÁ EL DEDO</strong>
          <small>DESLIZÁ POR TODA LA PANTALLA<br>PARA DESCUBRIRLA</small>
          <i>✦</i>
        </div>
      </div>
      <a class="hotspot calendar-link" href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=XV+de+Ailyn&amp;dates=20261122T003000Z/20261122T083000Z&amp;details=Mis+XV+de+Ailyn&amp;location=Las+Catalinas+Eventos%2C+Mocoret%C3%A1%2C+Corrientes" target="_blank" rel="noopener" aria-label="Agregar al calendario"></a>
    </section>

    <section class="panel image-panel action-panel" aria-label="Cómo llegar">
      <img src="assets/como-llegar.png" alt="Cómo llegar a Las Catalinas">
      <button class="hotspot location-open" type="button" aria-label="Ver ubicación"></button>
    </section>

    <section class="panel image-panel dress-panel" aria-label="Dress code">
      <img src="assets/dress-code.png" alt="Dress code elegante sport">
    </section>

    <section class="panel image-panel action-panel music-panel" aria-label="Elegir una canción">
      <img src="assets/musica.png" alt="Música. Elegí una canción para mis XV">
      <div class="headphones-beat" aria-hidden="true"></div>
      <div class="satin-reflection" aria-hidden="true"></div>
      <a class="hotspot music-link" href="https://open.spotify.com/playlist/2f8gs7otKtLbanOgdE1pRE?si=eUvnH_8CST6dCSR2U0OA4w&amp;utm_source=whatsapp&amp;pt=8f4ae32e869a66f99e205aa708c451f8&amp;pi=2QMWeCnqT0GD9" target="_blank" rel="noopener" aria-label="Agregar una canción a la playlist de los XV de Ailyn"></a>
    </section>

    <section class="panel image-panel action-panel gift-panel" aria-label="Regalos">
      <img src="assets/regalos.png" alt="Tu presencia es mi mejor regalo. Si querés hacerme un presente, podés ver los datos">
      <button class="hotspot gift-open" type="button" aria-label="Ver datos para regalos"></button>
    </section>

    <section class="panel image-panel guests-panel" aria-labelledby="guests-title">
      <img src="assets/invitados.png" alt="" aria-hidden="true">
      <div class="guests-card">
        <p id="guests-title" class="guests-kicker">ESTA INVITACIÓN ES PARA</p>
        <p id="nombres-invitados" class="guests-names"></p>
        <span class="guests-ornament" aria-hidden="true"></span>
        <p id="cantidad-lugares" class="guests-places"></p>
        <p class="guests-note">Te espero para compartir<br>una noche inolvidable</p>
      </div>
    </section>

    <section class="panel image-panel action-panel" aria-label="Confirmación de asistencia">
      <img src="assets/confirmacion.png" alt="Quiero compartir esta noche con vos. ¿Venís?">
      <a id="boton-confirmar" class="hotspot rsvp-link" href="https://bloomdate-rsvp.netlify.app/r/cumple-xv-aylin" target="_blank" rel="noopener" aria-label="Confirmar asistencia a los XV de Ailyn"></a>
    </section>
  </main>

  <footer>
    <p>Hecho con amor <span aria-label="corazón">♡</span> por <strong>bloomdate</strong></p>
    <nav aria-label="Contacto de Bloomdate">
      <a href="https://wa.me/541140436324" target="_blank" rel="noopener" aria-label="WhatsApp de Bloomdate"><img src="assets/icon-whatsapp.svg" alt=""></a>
      <a href="https://instagram.com/bloomdate.invitaciones" target="_blank" rel="noopener" aria-label="Instagram de Bloomdate"><img src="assets/icon-instagram.svg" alt=""></a>
      <a href="https://bloomdate-site.netlify.app/" target="_blank" rel="noopener" aria-label="Web de Bloomdate"><img src="assets/icon-web.svg" alt=""></a>
    </nav>
  </footer>

  <audio id="background-music" preload="auto" loop>
    <source src="assets/every-breath-you-take.mp3" type="audio/mpeg">
  </audio>
  <button class="audio-control" type="button" aria-label="Reproducir música" aria-pressed="false" hidden>
    <svg class="audio-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>
    <svg class="audio-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>
  </button>

  <dialog id="location-modal" class="modal">
    <div class="modal-card image-modal">
      <img src="assets/modal-ubicacion.png" alt="Cómo llegar a Las Catalinas">
      <button class="modal-close" type="button" aria-label="Cerrar">×</button>
      <a class="modal-map-link" href="https://maps.app.goo.gl/BPVHsQXyQwRgyc666?g_st=aw" target="_blank" rel="noopener" aria-label="Abrir ubicación en Google Maps"></a>
      <a class="modal-waze-link" href="https://waze.com/ul?q=Las%20Catalinas%20Eventos%20Mocoret%C3%A1%20Corrientes&amp;navigate=yes" target="_blank" rel="noopener" aria-label="Abrir ubicación en Waze"></a>
    </div>
  </dialog>

  <dialog id="gift-modal" class="modal">
    <div class="modal-card image-modal">
      <img src="assets/modal-regalos.png" alt="Datos para regalos: titular Marzoratti Mariela, alias marielai.marzoratti">
      <button class="modal-close" type="button" aria-label="Cerrar">×</button>
      <button class="copy-alias" type="button" data-alias="MARIELAI.MARZORATTI" aria-label="Copiar alias MARIELAI.MARZORATTI"></button>
      <span class="copy-toast" role="status">Alias copiado</span>
    </div>
  </dialog>

  <script src="script.js"></script>
  <script src="invitation-personalization.js"></script>
</body>
</html>
